name: IvyCPG DSR Historical Sync (Robust Version)

on:
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Số ngày muốn lùi về (ví dụ -30)'
        required: true
        default: '-30'

jobs:
  sync_history:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install chromium

      - name: Run Historical Scraper (With Auto-Restart)
        env:
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          # Thư viện Documents của SharePoint (giống Ivy_DSR_Yesterday.yml)
          SHAREPOINT_DOMAIN: "88p264.sharepoint.com"
          OUT_FOLDER: "/C5-Insight/09_coverage"
          DAYS_RANGE: ${{ github.event.inputs.days_back }}
          IVY_PASSWORD: ${{ secrets.pass_word_ivy }}
        run: |
          python - <<'PYCODE'
          import os, re, time, requests, io
          from datetime import datetime, timedelta
          from playwright.sync_api import sync_playwright

          TENANT_ID = os.environ["TENANT_ID"]
          CLIENT_ID = os.environ["CLIENT_ID"]
          CLIENT_SECRET = os.environ["CLIENT_SECRET"]
          SHAREPOINT_DOMAIN = os.environ["SHAREPOINT_DOMAIN"]
          OUT_FOLDER = os.environ["OUT_FOLDER"]
          DAYS_RANGE = int(os.environ.get("DAYS_RANGE", -30))
          GRAPH_API = "https://graph.microsoft.com/v1.0"

          BRANCHES = [
              {"name": "CN BINH DINH", "code": "BDINH"},
              {"name": "CN KHANH HOA", "code": "KHOA"},
              {"name": "CN PHU YEN", "code": "PHYEN"}
          ]

          def get_vn_now():
              return datetime.utcnow() + timedelta(hours=7)

          def get_access_token():
              url = f"https://login.microsoftonline.com/{TENANT_ID}/oauth2/v2.0/token"
              data = {"grant_type": "client_credentials", "client_id": CLIENT_ID, "client_secret": CLIENT_SECRET, "scope": "https://graph.microsoft.com/.default"}
              return requests.post(url, data=data).json().get("access_token")

          def select_date_smart(iframe, target_dt):
              iframe.get_by_role("textbox", name="Date").click()
              time.sleep(1)
              current_now = get_vn_now()
              diff_month = (current_now.year - target_dt.year) * 12 + (current_now.month - target_dt.month)
              if diff_month > 0:
                  for _ in range(diff_month):
                      iframe.locator(".ui-icon-circle-triangle-w").click()
                      time.sleep(0.5)
              iframe.get_by_role("link", name=str(target_dt.day), exact=True).click()

          def download_report(page, branch, target_dt):
              print(f"   [{get_vn_now().strftime('%H:%M:%S')}] 🌀 {branch['code']} | {target_dt.strftime('%d/%m/%Y')}")
              # Tên link có thể kèm ký tự icon ở đầu, nên so theo chữ "DSR Today" (không lấy "DSR Today - 1 Hour")
              page.locator("a").filter(has_text=re.compile(r"^\W*DSR Today\s*$")).first.click()
              time.sleep(2)
              iframe_main = page.frame_locator("#iContent")
              iframe_main.get_by_role("textbox").first.click()
              iframe_main.get_by_role("list").get_by_text(branch['name'], exact=True).click()
              select_date_smart(iframe_main, target_dt)
              iframe_main.get_by_text("DSR Today").click()
              
              iframe_report = iframe_main.frame_locator("#myReportIFrame")
              export_btn = iframe_report.get_by_role("link", name="Export drop down menu Export")
              export_btn.wait_for(state="visible", timeout=120000)
              export_btn.click()

              with page.expect_download(timeout=60000) as download_info:
                  with page.expect_popup() as page1_info:
                      iframe_report.get_by_role("link", name="Excel").click()
                  page1 = page1_info.value
                  page1.close()
              
              download = download_info.value
              file_name = f"{branch['code']}_{target_dt.strftime('%d%m%y')}_Hist.xlsx"
              path = download.path()
              with open(path, "rb") as f:
                  data = f.read()
              # Xóa file tạm ngay để giải phóng Disk
              if os.path.exists(path): os.remove(path)
              return file_name, data

          # --- CHƯƠNG TRÌNH CHÍNH VỚI CƠ CHẾ RESTART ---
          try:
              token = get_access_token()
              headers = {"Authorization": f"Bearer {token}"}
              site_info = requests.get(f"{GRAPH_API}/sites/{SHAREPOINT_DOMAIN}", headers=headers).json()
              if "id" not in site_info:
                  print("❌ Không lấy được Site ID:", site_info)
                  exit(1)
              drive_info = requests.get(f"{GRAPH_API}/sites/{site_info['id']}/drive", headers=headers).json()
              if "id" not in drive_info:
                  print("❌ Không lấy được Drive ID:", drive_info)
                  exit(1)
              drive_id = drive_info["id"]

              # Chạy ngược từ ngày xa nhất
              for i in range(DAYS_RANGE, 1):
                  target_dt = get_vn_now() + timedelta(days=i)
                  print(f"\n🚀 === BẮT ĐẦU NGÀY: {target_dt.strftime('%d/%m/%Y')} ===")

                  # KHỞI TẠO TRÌNH DUYỆT MỚI CHO MỖI NGÀY ĐỂ GIẢI PHÓNG RAM
                  with sync_playwright() as p:
                      browser = p.chromium.launch(headless=True)
                      context = browser.new_context()
                      page = context.new_page()
                      
                      # Đăng nhập lại
                      page.goto("https://png-vn.ivycpg.com/web/")
                      page.get_by_role("textbox", name="Username *").fill("2001584413.admin")
                      page.get_by_role("textbox", name="Password *").fill(os.environ["IVY_PASSWORD"])
                      page.get_by_role("button", name="Login").click()
                      page.wait_for_load_state("networkidle")
                      page.get_by_role("link", name=" Reports ").click()

                      for branch in BRANCHES:
                          try:
                              fname, fcontent = download_report(page, branch, target_dt)
                              upload_url = f"{GRAPH_API}/drives/{drive_id}/root:{OUT_FOLDER}/{fname}:/content?@microsoft.graph.conflictBehavior=replace"
                              up_res = requests.put(upload_url, headers=headers, data=fcontent)
                              if up_res.ok: print(f"      ✅ Upload xong: {fname}")
                              else: print(f"      ❌ Lỗi SharePoint {fname}: {up_res.text}")
                              time.sleep(1)
                          except Exception as e:
                              print(f"      ⚠️ Lỗi {branch['code']}: {e}")
                              continue
                      
                      # Đóng trình duyệt sau khi xong 1 ngày
                      browser.close()
                      print(f"🧹 Đã đóng trình duyệt & dọn dẹp RAM cho ngày tiếp theo.")

          except Exception as e:
              print(f"❌ Lỗi hệ thống: {e}")
              exit(1)
          PYCODE
